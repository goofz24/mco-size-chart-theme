# Runs on every push and pull request: Theme Check, unit/Liquid tests and browser tests.
# Needs no secrets and never touches a Shopify store.
name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Theme Check (fails on errors; Dawn's own 9 warnings are expected)
        run: npx --yes @shopify/cli@5.0.0 theme check --fail-level error
      - name: Unit and Liquid render tests
        run: npm test
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:browser
